name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install synthkit
        run: pip install -e ".[dev]"

      - name: Install pytest-synthkit
        run: pip install -e ./pytest-synthkit

      - name: Ruff
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Test synthkit
        run: pytest tests/ -q

      - name: Test pytest-synthkit
        run: pytest pytest-synthkit/tests/ -q

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install synthkit
        run: pip install -e ".[dev]" mypy

      - name: mypy
        run: mypy src/synthkit
