name: Release

# Wired up but not fired: publishing happens only when a GitHub Release is published, which
# hasn't happened yet for this project. Uses PyPI trusted publishing (OIDC), so no API token
# needs to live in repo secrets.

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
