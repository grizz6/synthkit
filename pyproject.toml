[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthkit"
version = "0.0.1"
description = "pytest fixtures that look like your production data, without your production data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grishma Gajurel" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/synthkit"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
