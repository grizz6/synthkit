[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthkit"
version = "0.0.1"
description = "pytest fixtures that look like your production data, without your production data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grishma Gajurel" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyarrow>=14.0",
]

[project.scripts]
synthkit = "synthkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/synthkit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Typer's Option()/Argument() as default values is the documented pattern.
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# warn_return_any is deliberately off: numpy/pandas operations routinely return values mypy
# can only see as `Any`, and chasing every one of those with a cast would add noise without
# catching real bugs in a numeric library like this one.

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
