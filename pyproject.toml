[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthkit"
version = "0.0.1"
description = "pytest fixtures that look like your production data, without your production data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Grishma Gajurel" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyarrow>=14.0",
]

[project.scripts]
synthkit = "synthkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/synthkit"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
