site_name: synthkit
site_description: pytest fixtures that look like your production data, without your production data.
repo_url: https://github.com/grizz6/synthkit
theme:
  name: material
  palette:
    scheme: slate

nav:
  - Home: index.md
  - Limitations: LIMITATIONS.md
  - Plan: PLAN.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
